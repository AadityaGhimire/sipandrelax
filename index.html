<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sip and Relax Cafe</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5f2;
      color: #333;
    }
    header {
      background: #3e2723;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      background: #5d4037;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    .hero {
      background: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93') center/cover;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2em;
      font-weight: bold;
    }
    .section {
      padding: 40px;
      text-align: center;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .menu-item {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .menu-item img {
      width: 100%;
      border-radius: 10px;
    }
    footer {
      background: #3e2723;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>Sip and Relax ☕</h1>
  <p>Cafe & Fastfood Corner</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#menu">Menu</a>
  <a href="#contact">Contact</a>
</nav>

<div class="hero">
  Good Vibes & Great Food
</div>

<div class="section" id="menu">
  <h2>Our Menu</h2>
  <div class="menu">
    <div class="menu-item">
      <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085">
      <h3>Coffee</h3>
      <p>Fresh brewed coffee</p>
    </div>
    <div class="menu-item">
      <img src="https://images.unsplash.com/photo-1551782450-a2132b4ba21d">
      <h3>Burger</h3>
      <p>Juicy grilled burger</p>
    </div>
    <div class="menu-item">
      <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624">
      <h3>Pizza</h3>
      <p>Hot cheesy pizza</p>
    </div>
    <div class="menu-item">
      <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836">
      <h3>Snacks</h3>
      <p>Quick bites & fries</p>
    </div>
  </div>
</div>

<div class="section" id="contact">
  <h2>Contact Us</h2>
  <p>📍 Kathmandu, Nepal</p>
  <p>📞 98XXXXXXXX</p>
</div>

<footer>
  <p>© 2026 Sip and Relax Cafe</p>
</footer>

</body>
</html>
